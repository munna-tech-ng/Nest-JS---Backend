name: Hub deploy
# pack stack: nestjs

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  # Set HUB_PROJECT_ID in GitHub Actions variables after linking the Hub project.
  HUB_PROJECT_ID: ${{ vars.HUB_PROJECT_ID }}
  IMAGE_NAME: ghcr.io/munna-tech-ng/nest-js-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      # Hub notify: POST /v1/projects/:id/builds
      # Secrets: HUB_API_URL (e.g. https://hub.example.com), HUB_BUILD_TOKEN (operator PAT with git:write or deploy:run).
      # Alternative: omit this step and rely on workflow_run + projects.image_repository on the Hub project.
      - name: Notify Hub builds API
        env:
          HUB_API_URL: ${{ secrets.HUB_API_URL }}
          HUB_BUILD_TOKEN: ${{ secrets.HUB_BUILD_TOKEN }}
        run: |
          test -n "${HUB_API_URL}"
          test -n "${HUB_PROJECT_ID}"
          curl -fsS -X POST \
            "${HUB_API_URL}/v1/projects/${HUB_PROJECT_ID}/builds" \
            -H "Authorization: Bearer ${HUB_BUILD_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: ${{ github.run_id }}-${{ github.sha }}" \
            -d "{\"commitSha\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"imageRepository\":\"${IMAGE_NAME}\"}"
